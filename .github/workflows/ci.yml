name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore DotnetCqrsEventSourcing.sln

      - name: Build solution
        run: dotnet build DotnetCqrsEventSourcing.sln --no-restore -c Release

      - name: Run xUnit Tests with Coverage
        run: dotnet test DotnetCqrsEventSourcing.sln --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage"
